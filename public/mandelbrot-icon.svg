<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="35%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Mandelbrot set silhouette - stylized cardioid and circular bulb -->
  <g transform="translate(256, 256) scale(1.8)">
    <!-- Main cardioid body -->
    <path d="M -60,0
             C -60,-80 40,-100 60,-60
             C 80,-20 80,20 60,60
             C 40,100 -60,80 -60,0 Z"
          fill="#000"/>

    <!-- Period-2 bulb (left circle) -->
    <circle cx="-95" cy="0" r="35" fill="#000"/>

    <!-- Small decorative bulbs -->
    <circle cx="-125" cy="-15" r="8" fill="#000"/>
    <circle cx="-125" cy="15" r="8" fill="#000"/>
    <circle cx="-130" cy="0" r="5" fill="#000"/>

    <!-- Top antenna bulbs -->
    <circle cx="20" cy="-75" r="12" fill="#000"/>
    <circle cx="35" cy="-82" r="6" fill="#000"/>
    <circle cx="-15" cy="-78" r="8" fill="#000"/>

    <!-- Bottom antenna bulbs -->
    <circle cx="20" cy="75" r="12" fill="#000"/>
    <circle cx="35" cy="82" r="6" fill="#000"/>
    <circle cx="-15" cy="78" r="8" fill="#000"/>

    <!-- Period-3 bulbs -->
    <circle cx="-45" cy="-55" r="10" fill="#000"/>
    <circle cx="-45" cy="55" r="10" fill="#000"/>
  </g>

  <!-- Colorful border representing iteration colors -->
  <g transform="translate(256, 256) scale(1.85)">
    <!-- Outer glow rings -->
    <ellipse cx="-20" cy="0" rx="100" ry="85" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
    <ellipse cx="-20" cy="0" rx="105" ry="90" fill="none" stroke="#ffd93d" stroke-width="2" opacity="0.5"/>
    <ellipse cx="-20" cy="0" rx="110" ry="95" fill="none" stroke="#6bcb77" stroke-width="2" opacity="0.4"/>
    <ellipse cx="-20" cy="0" rx="115" ry="100" fill="none" stroke="#4d96ff" stroke-width="2" opacity="0.3"/>
    <ellipse cx="-20" cy="0" rx="120" ry="105" fill="none" stroke="#9b59b6" stroke-width="1" opacity="0.2"/>
  </g>
</svg>
