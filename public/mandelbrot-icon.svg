<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- White background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Colorful iteration bands around the set -->
  <g transform="translate(280, 256) scale(2.2)">
    <!-- Outer color bands -->
    <ellipse cx="-30" cy="0" rx="95" ry="80" fill="#9b59b6"/>
    <ellipse cx="-30" cy="0" rx="88" ry="74" fill="#4d96ff"/>
    <ellipse cx="-30" cy="0" rx="81" ry="68" fill="#6bcb77"/>
    <ellipse cx="-30" cy="0" rx="74" ry="62" fill="#ffd93d"/>
    <ellipse cx="-30" cy="0" rx="67" ry="56" fill="#ff6b6b"/>
    <ellipse cx="-30" cy="0" rx="60" ry="50" fill="#e74c3c"/>
  </g>

  <!-- The Mandelbrot set (black) -->
  <g transform="translate(280, 256) scale(2.2)">
    <!-- Main cardioid -->
    <path d="M -50,0
             C -50,-55 25,-70 45,-40
             C 60,-15 60,15 45,40
             C 25,70 -50,55 -50,0 Z"
          fill="#000"/>

    <!-- Period-2 bulb -->
    <circle cx="-75" cy="0" r="25" fill="#000"/>

    <!-- Small bulbs on period-2 -->
    <circle cx="-98" cy="-8" r="5" fill="#000"/>
    <circle cx="-98" cy="8" r="5" fill="#000"/>
    <circle cx="-100" cy="0" r="3" fill="#000"/>

    <!-- Top decorations -->
    <circle cx="15" cy="-52" r="8" fill="#000"/>
    <circle cx="-8" cy="-54" r="5" fill="#000"/>
    <circle cx="28" cy="-55" r="4" fill="#000"/>

    <!-- Bottom decorations (mirror) -->
    <circle cx="15" cy="52" r="8" fill="#000"/>
    <circle cx="-8" cy="54" r="5" fill="#000"/>
    <circle cx="28" cy="55" r="4" fill="#000"/>

    <!-- Period-3 bulbs -->
    <circle cx="-38" cy="-38" r="7" fill="#000"/>
    <circle cx="-38" cy="38" r="7" fill="#000"/>
  </g>
</svg>
